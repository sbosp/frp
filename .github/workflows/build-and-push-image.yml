name: Build Image Only

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag'
        required: true
        default: 'test'
permissions:
  contents: read

jobs:
  # ... existing code ...
  build:
    name: Build Binaries and Upload to Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Build frpc
        run: |
          go build -o frpc ./cmd/frpc
          mkdir -p artifacts
          mv frpc artifacts/

      - name: Build frps
        run: |
          go build -o frps ./cmd/frps
          mkdir -p artifacts
          mv frps artifacts/

      - name: Upload Release Assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./artifacts/frpc
          asset_name: frpc
          asset_content_type: application/octet-stream

      - name: Upload frps Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./artifacts/frps
          asset_name: frps
          asset_content_type: application/octet-stream

